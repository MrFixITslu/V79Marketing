services:
  marketing-data-init:
    image: node:22-alpine
    user: "0:0"
    entrypoint: ["sh", "-ec", "mkdir -p /app/data && chown -R 1000:1000 /app/data"]
    restart: "no"
    volumes:
      - v79_data:/app/data
    networks:
      - proxy_network

  v79-marketing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v79marketing-app
    restart: unless-stopped
    depends_on:
      marketing-data-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3070
      APP_URL: ${APP_URL:-https://marketing.v79sl.com}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/v79_marketing.sqlite}
      JWT_SECRET: ${JWT_SECRET}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      V79_HUB_PUBLIC_URL: ${V79_HUB_PUBLIC_URL:-https://hub.v79sl.com}
      V79_HUB_INTERNAL_URL: ${V79_HUB_INTERNAL_URL:-http://v79-hub:3040}
      V79_MARKETING_LAUNCH_SECRET: ${V79_MARKETING_LAUNCH_SECRET}
      V79_HUB_PROVISION_SECRET: ${V79_PLATFORM_SHARED_SECRET}
      V79_PLATFORM_SHARED_SECRET: ${V79_PLATFORM_SHARED_SECRET}
      V79_HUB_EVENT_URL: ${V79_HUB_EVENT_URL:-http://v79-hub:3040/api/platform/events}
      V79_HUB_EVENT_SECRET: ${V79_HUB_EVENT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      V79_ALLOW_LEGACY_LOGIN: "0"
      V79_MARKETING_SEED_DEMO: "0"
      V79_ENABLE_SIMULATED_PUBLISHER: "0"
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v24.0}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_VERSION: ${LINKEDIN_VERSION:-202609}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_MAX_UPLOAD_BYTES: ${YOUTUBE_MAX_UPLOAD_BYTES:-1073741824}
    expose:
      - "3070"
    volumes:
      - v79_data:/app/data
    networks:
      - proxy_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3070/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  proxy_network:
    external: true

volumes:
  v79_data:
    name: v79marketing_v79_data
